<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buy Orders | EduTrade</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800">
  <div data-navbar></div>

  <main class="mx-auto max-w-7xl px-4 py-10 sm:px-6">
    <div class="flex flex-col justify-between gap-5 sm:flex-row sm:items-end">
      <div>
        <p class="text-sm font-bold uppercase tracking-[.16em] text-blue-600">Student requests</p>
        <h1 class="mt-2 text-3xl font-bold tracking-tight text-slate-900">Buy orders</h1>
        <p class="mt-2 max-w-2xl text-slate-500">See what students are looking for and offer an item you no longer need.</p>
      </div>
      <a href="create-post.html" class="inline-flex items-center justify-center rounded-xl bg-blue-600 px-5 py-3 text-sm font-semibold text-white shadow-sm transition hover:-translate-y-0.5 hover:bg-blue-700">+ Create an order</a>
    </div>

    <section class="mt-8 rounded-2xl border border-slate-200 bg-white p-4 shadow-sm">
      <div class="grid gap-3 md:grid-cols-[1fr_auto_auto]">
        <label class="relative block"><span class="sr-only">Search buy orders</span><input id="order-search" type="search" placeholder="Search books, calculators, notes…" class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 pl-10 text-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100" /><span class="absolute left-3 top-3 text-slate-400">⌕</span></label>
        <select id="category-filter" class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-blue-500"><option value="all">All categories</option><option>Books</option><option>Calculators</option><option>Notes</option><option>Electronics</option></select>
        <select id="sort-orders" class="rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-blue-500"><option value="recent">Newest first</option><option value="budget">Highest budget</option></select>
      </div>
    </section>

    <p id="order-count" class="mt-6 text-sm font-medium text-slate-500"></p>
    <section id="orders-grid" class="mt-4 grid gap-5 md:grid-cols-2 xl:grid-cols-3" aria-live="polite"></section>
    <p id="empty-orders" class="mt-8 hidden rounded-2xl border border-dashed border-slate-300 bg-white p-10 text-center text-slate-500">No orders match your search. Try another keyword or category.</p>
  </main>

  <footer class="border-t border-slate-200 bg-white px-4 py-6 text-center text-sm text-slate-500">© 2026 EduTrade · A student marketplace</footer>
  <script src="../js/navbar.js"></script>
  <script src="../js/buy-orders.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Post | EduTrade</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-[#F5F5F3] text-gray-800">
    <div data-navbar></div>
 



    <!-- ================= MAIN ================= -->

    <main class="mx-auto max-w-4xl px-4 py-10">

        <!-- Heading -->

        <div class="mb-8">

            <p class="text-sm font-medium text-gray-700">
                EDUTRADE MARKETPLACE
            </p>

            <h1 class="mt-2 text-3xl font-bold md:text-4xl">
                Create a New Post
            </h1>

            <p class="mt-2 text-gray-500">
                Sell an item, report something lost, or post an item you found.
            </p>

        </div>



        <!-- ================= POST TYPE ================= -->

        <div class="mb-6 rounded-2xl border border-gray-200 bg-white p-6 shadow-sm">

            <h2 class="text-lg font-semibold">
                What do you want to post?
            </h2>


            <div class="mt-5 grid gap-4 md:grid-cols-3">


                <!-- SELL -->

                <label class="cursor-pointer">

                    <input
                        type="radio"
                        name="postType"
                        value="sell"
                        class="peer sr-only"
                    >

                    <div class="rounded-xl border-2 border-gray-200 p-5 transition hover:border-green-500 peer-checked:border-green-700 peer-checked:bg-green-50">

                        <div class="text-3xl">
                            💰
                        </div>

                        <h3 class="mt-3 font-semibold">
                            Sell
                        </h3>

                        <p class="mt-1 text-sm text-gray-500">
                            Sell your educational resources.
                        </p>

                    </div>

                </label>



                <!-- LOST -->

                <label class="cursor-pointer">

                    <input
                        type="radio"
                        name="postType"
                        value="lost"
                        class="peer sr-only"
                    >

                    <div class="rounded-xl border-2 border-gray-200 p-5 transition hover:border-red-400 peer-checked:border-red-500 peer-checked:bg-red-50">

                        <div class="text-3xl">
                            🔴
                        </div>

                        <h3 class="mt-3 font-semibold">
                            Lost
                        </h3>

                        <p class="mt-1 text-sm text-gray-500">
                            Report something you lost.
                        </p>

                    </div>

                </label>



                <!-- FOUND -->

                <label class="cursor-pointer">

                    <input
                        type="radio"
                        name="postType"
                        value="found"
                        class="peer sr-only"
                    >

                    <div class="rounded-xl border-2 border-gray-200 p-5 transition hover:border-blue-400 peer-checked:border-blue-500 peer-checked:bg-blue-50">

                        <div class="text-3xl">
                            🟢
                        </div>

                        <h3 class="mt-3 font-semibold">
                            Found
                        </h3>

                        <p class="mt-1 text-sm text-gray-500">
                            Help return an item to its owner.
                        </p>

                    </div>

                </label>


            </div>

        </div>



        <!-- ================= FORM ================= -->

        <form class="rounded-2xl border border-gray-200 bg-white p-6 shadow-sm md:p-8">


            <!-- Common Information -->

            <div>

                <h2 class="text-xl font-semibold">
                    Item Information
                </h2>

                <p class="mt-1 text-sm text-gray-500">
                    Provide details about the item.
                </p>

            </div>



            <div class="mt-6 grid gap-6 md:grid-cols-2">


                <!-- Item Name -->

                <div class="md:col-span-2">

                    <label class="mb-2 block text-sm font-medium">
                        Item Name
                    </label>

                    <input
                        type="text"
                        placeholder="Example: Data Structure Book"
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none focus:border-green-600 focus:ring-2 focus:ring-green-100"
                    >

                </div>



                <!-- Category -->

                <div>

                    <label class="mb-2 block text-sm font-medium">
                        Category
                    </label>

                    <select
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none focus:border-green-600 focus:ring-2 focus:ring-green-100"
                    >

                        <option>Select Category</option>

                        <option>Books</option>

                        <option>Notes</option>

                        <option>PDF / Study Materials</option>

                        <option>Calculator</option>

                        <option>Electronics Components</option>

                        <option>Devices & Accessories</option>

                        <option>Question Papers</option>

                        <option>Lab Equipment</option>

                        <option>Others</option>

                    </select>

                </div>



                <!-- Contact -->

                <div>

                    <label class="mb-2 block text-sm font-medium">
                        Contact Information
                    </label>

                    <input
                        type="text"
                        placeholder="Phone number or email"
                        class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none focus:border-green-600 focus:ring-2 focus:ring-green-100"
                    >

                </div>


            </div>



            <!-- Description -->

            <div class="mt-6">

                <label class="mb-2 block text-sm font-medium">
                    Description
                </label>

                <textarea
                    rows="5"
                    placeholder="Write details about your item..."
                    class="w-full resize-none rounded-lg border border-gray-300 px-4 py-3 outline-none focus:border-green-600 focus:ring-2 focus:ring-green-100"
                ></textarea>

            </div>



            <!-- ================= SELL FIELDS ================= -->

            <div class="mt-8 border-t border-gray-200 pt-6">

                <h2 class="text-lg font-semibold text-green-700">
                    Sell Information
                </h2>


                <div class="mt-5 grid gap-6 md:grid-cols-2">


                    <!-- Condition -->

                    <div>

                        <label class="mb-2 block text-sm font-medium">
                            Item Condition
                        </label>

                        <select
                            class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none focus:border-green-600"
                        >

                            <option>Select Condition</option>

                            <option>New</option>

                            <option>Like New</option>

                            <option>Good</option>

                            <option>Used</option>

                        </select>

                    </div>



                    <!-- Price -->

                    <div>

                        <label class="mb-2 block text-sm font-medium">
                            Price (BDT)
                        </label>

                        <input
                            type="number"
                            placeholder="Example: 350"
                            class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none focus:border-green-600"
                        >

                    </div>


                </div>

            </div>



            <!-- ================= LOST / FOUND ================= -->

            <div class="mt-8 border-t border-gray-200 pt-6">

                <h2 class="text-lg font-semibold">
                    Lost / Found Information
                </h2>


                <div class="mt-5 grid gap-6 md:grid-cols-2">


                    <!-- Location -->

                    <div>

                        <label class="mb-2 block text-sm font-medium">
                            Location
                        </label>

                        <input
                            type="text"
                            placeholder="Example: University Library"
                            class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none focus:border-green-600"
                        >

                    </div>



                    <!-- Date -->

                    <div>

                        <label class="mb-2 block text-sm font-medium">
                            Date
                        </label>

                        <input
                            type="date"
                            class="w-full rounded-lg border border-gray-300 px-4 py-3 outline-none focus:border-green-600"
                        >

                    </div>


                </div>

            </div>



            <!-- Image Upload -->

            <div class="mt-8 border-t border-gray-200 pt-6">

                <label class="mb-2 block text-sm font-medium">
                    Item Image
                </label>

                <div class="rounded-xl border-2 border-dashed border-gray-300 p-10 text-center">

                    <div class="text-4xl">
                        📷
                    </div>

                    <p class="mt-3 font-medium">
                        Upload an image
                    </p>

                    <p class="mt-1 text-sm text-gray-500">
                        PNG, JPG or JPEG
                    </p>

                    <input
                        type="file"
                        accept="image/*"
                        class="mt-4"
                    >

                </div>

            </div>



            <!-- Submit -->

            <div class="mt-8 flex justify-end gap-4">

                <button
                    type="reset"
                    class="rounded-lg border border-gray-300 px-6 py-3 font-medium hover:bg-gray-100"
                >
                    Cancel
                </button>


                <button
                    type="submit"
                    class="rounded-lg bg-green-700 px-6 py-3 font-medium text-white transition hover:bg-green-800"
                >
                    Publish Post
                </button>

            </div>


        </form>

    </main>

    <script src="../js/navbar.js"></script>
</body>
</html>

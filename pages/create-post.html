<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduTrade - Create Post</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-[#f7f8fa] text-[#172033]">
<div id="navbar-placeholder"></div>
  <div class="max-w-2xl mx-auto mt-5 bg-white rounded-2xl shadow-lg border border-gray-100 p-6 sm:p-10">
    
    <!-- Header -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-extrabold text-blue-600">EduTrade</h1>
      <p class="text-gray-500 text-sm mt-1">Post your educational resources for Sale or Rent</p>
    </div>

    <form id="createPostForm" class="space-y-6">
      
      <!-- Item Title -->
      <div>
        <label for="title" class="block text-sm font-semibold text-gray-700 mb-1">Item Title <span class="text-red-500">*</span></label>
        <input 
          type="text" 
          id="title" 
          placeholder="e.g., Engineering Mathematics Book / Arduino Uno Kit" 
          required 
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
        >
      </div>

      <!-- Action Type & Category (Grid) -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Listing Type -->
        <div>
          <label for="listingType" class="block text-sm font-semibold text-gray-700 mb-1">I want to <span class="text-red-500">*</span></label>
          <select 
            id="listingType" 
            required 
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-white"
          >
            <option value="Sell" selected>Sell</option>
            <option value="Rent">Rent</option>
          </select>
        </div>

        <!-- Category -->
        <div>
          <label for="category" class="block text-sm font-semibold text-gray-700 mb-1">Category <span class="text-red-500">*</span></label>
          <select 
            id="category" 
            required 
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-white"
          >
            <option value="" disabled selected>Select Category</option>
            <option value="Books">Books & Reference</option>
            <option value="Notes">Notes & Guides</option>
            <option value="Electronics">Electronic Components</option>
            <option value="Lab Equipment">Lab Equipment</option>
            <option value="Calculators">Calculators</option>
            <option value="Project Materials">Project Materials</option>
          </select>
        </div>
      </div>

      <!-- Price & Condition (Grid) -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <!-- Price -->
        <div>
          <label for="price" class="block text-sm font-semibold text-gray-700 mb-1">Price (BDT) <span class="text-red-500">*</span></label>
          <input 
            type="number" 
            id="price" 
            placeholder="e.g., 250" 
            min="0"
            required 
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
          >
        </div>

        <!-- Condition -->
        <div>
          <label for="condition" class="block text-sm font-semibold text-gray-700 mb-1">Condition <span class="text-red-500">*</span></label>
          <select 
            id="condition" 
            required 
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-white"
          >
            <option value="New">Brand New</option>
            <option value="Like New">Like New</option>
            <option value="Used">Used / Good</option>
          </select>
        </div>
      </div>

      <!-- Contact Phone/Location -->
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label for="contact" class="block text-sm font-semibold text-gray-700 mb-1">Contact Number <span class="text-red-500">*</span></label>
          <input 
            type="tel" 
            id="contact" 
            placeholder="01XXXXXXXXX" 
            required 
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
          >
        </div>
        <div>
          <label for="location" class="block text-sm font-semibold text-gray-700 mb-1">Campus / Location <span class="text-red-500">*</span></label>
          <input 
            type="text" 
            id="location" 
            placeholder="e.g., Main Campus / Library area" 
            required 
            class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition"
          >
        </div>
      </div>

      <!-- Description -->
      <div>
        <label for="description" class="block text-sm font-semibold text-gray-700 mb-1">Description <span class="text-red-500">*</span></label>
        <textarea 
          id="description" 
          rows="4" 
          placeholder="Mention details about the product condition, edition, author, or rental terms..." 
          required 
          class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition resize-y"
        ></textarea>
      </div>

      <!-- Image Upload -->
      <div>
        <label for="productImage" class="block text-sm font-semibold text-gray-700 mb-1">Upload Product Image</label>
        <input 
          type="file" 
          id="productImage" 
          accept="image/*" 
          class="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"
        >
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md transition duration-200"
      >
        Publish Item
      </button>

    </form>
  </div>
  <script src="../js/create-post.js"></script>
  <script src="../js/navbar.js"></script>
</body>
</html>

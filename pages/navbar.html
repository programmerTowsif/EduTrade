<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      
      <!-- Logo -->
      <div class="flex items-center space-x-3">
        <a href="home.html" class="flex items-center space-x-2">
          <span class="text-2xl font-extrabold text-blue-600">Edu<span class="text-gray-800">Trade</span></span>
        </a>
      </div>

      <!-- Search Bar -->
      <div class="hidden md:flex items-center flex-1 max-w-xs mx-6">
        <div class="relative w-full">
          <input 
            type="text" 
            id="navSearch"
            placeholder="Search books, components, notes..." 
            class="w-full bg-gray-100 text-sm text-gray-700 pl-10 pr-4 py-2 rounded-full focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white transition"
          >
          <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none">
            <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Desktop Links -->
      <div class="hidden md:flex items-center space-x-6">
        <a href="home.html" class="text-gray-700 hover:text-blue-600 font-medium text-sm transition">Home</a>
        <a href="marketplace.html" class="text-gray-700 hover:text-blue-600 font-medium text-sm transition">Marketplace</a>
        
        <!-- Wishlist -->
        <a href="wishlist.html" class="text-gray-700 hover:text-blue-600 font-medium text-sm transition flex items-center space-x-1 relative">
          <svg class="w-5 h-5 text-gray-500 hover:text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
          </svg>
          <span>Wishlist</span>
          <span id="wishlistCount" class="hidden bg-red-500 text-white text-xs px-1.5 py-0.5 rounded-full font-bold">0</span>
        </a>

        <!-- Create Post -->
        <a href="create-post.html" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-2 rounded-lg shadow-sm transition">
          + Create Post
        </a>

        <!-- Auth Section (Profile / Login-Logout) -->
        <div id="authSection" class="flex items-center space-x-3">
          <!-- JS dynamic content here -->
        </div>
      </div>

      <!-- Mobile Button -->
      <div class="flex md:hidden items-center">
        <button id="mobile-menu-btn" class="text-gray-600 hover:text-gray-900 focus:outline-none p-2">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
        </button>
      </div>

    </div>
  </div>

  <!-- Mobile Dropdown -->
  <div id="mobile-menu" class="hidden md:hidden bg-white border-b border-gray-200 px-4 pt-2 pb-4 space-y-3">
    <a href="home.html" class="block text-gray-700 hover:text-blue-600 font-medium py-1">Home</a>
    <a href="marketplace.html" class="block text-gray-700 hover:text-blue-600 font-medium py-1">Marketplace</a>
    <a href="wishlist.html" class="block text-gray-700 hover:text-blue-600 font-medium py-1">Wishlist</a>
    <a href="create-post.html" class="block text-center bg-blue-600 text-white font-semibold py-2 rounded-lg mt-2">+ Create Post</a>
    <div id="mobileAuthSection" class="pt-2 border-t border-gray-100"></div>
  </div>
</nav>
</body>
</html>
